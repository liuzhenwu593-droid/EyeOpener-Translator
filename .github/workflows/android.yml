name: Android CI

on:
  push:
    branches: [main, master]
    paths: ['**.kt', '**.kts', '**.xml', '**/build.gradle*', 'gradle/**', '.github/**', 'settings.gradle*', 'gradle.properties']
  pull_request:
    branches: [main, master]
    paths: ['**.kt', '**.kts', '**.xml', '**/build.gradle*', 'gradle/**', '.github/**', 'settings.gradle*', 'gradle.properties']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble Debug
        run: ./gradlew assembleDebug --no-daemon

      # Release 开启了 R8 缩减与资源压缩，仅构建 Debug 无法暴露 R8/keep 规则问题
      - name: Setup release signing
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured; release APK will be unsigned."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storeType=PKCS12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          # 注意:build.gradle.kts 把所有 variant 的输出文件名统一改成了 EyeOpener.apk,
          # 故此处用通配符而非 app-debug.apk
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
